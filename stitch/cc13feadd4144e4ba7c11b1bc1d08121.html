<!DOCTYPE html>

<html class="light" lang="tr"><head>

<body class="bg-background text-on-background font-body-base font-body-base min-h-screen pb-safe antialiased">
<!-- TopAppBar -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md font-inter antialiased text-slate-900 dark:text-slate-100 docked full-width top-0 sticky z-50 border-b border-slate-100 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-center h-16 px-6 w-full max-w-screen-xl mx-auto">
<div class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Alışkanlık Takibi</div>
<div class="flex items-center gap-4">
<button class="text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors p-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors p-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<img alt="Kullanıcı Profili" class="w-8 h-8 rounded-full object-cover" data-alt="Portrait of a user for profile avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8zffT75a2q9-S6iGSP7XpyrQRsWWbe3o1TEJJ-vterZ2aHKSEvyD2Yd3wCVcyddRWwRkHaVojp72Lvw6leuFtE6CkssqLpUFEbeeZsLollpPOE8SfyKBji7rAFljWmt0OjBtz4RvUnEmiXOqR0rfPhTAE5TzbeJUtRWHKOzoQyxXNQixFyN12IYtfjBsASY0axaDjfQYSeVYV_63cP2BSByq4FpkFFhO6ltElw7LJ068yPG2tzc9Ou_eZzcyzhAAXker7U7DANeo"/>
</div>
</div>
</header>
<main class="max-w-screen-xl mx-auto px-container-padding py-xl pb-24 md:pb-xl">
<!-- Stats Section -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-md mb-xl">
<!-- Stat Card 1 -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_1px_3px_rgba(15,23,42,0.05)] flex items-center justify-between border border-surface-variant">
<div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">Toplam Alışkanlık</p>
<p class="font-h2 text-h2 text-on-surface">12</p>
</div>
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
</div>
</div>
<!-- Stat Card 2 -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_1px_3px_rgba(15,23,42,0.05)] flex items-center justify-between border border-surface-variant">
<div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">Bugün Tamamlanan</p>
<p class="font-h2 text-h2 text-on-surface">5</p>
</div>
<div class="w-12 h-12 rounded-full bg-[#E8F5E9] flex items-center justify-center text-[#2E7D32]">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</div>
</div>
<!-- Stat Card 3 -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_1px_3px_rgba(15,23,42,0.05)] flex items-center justify-between border border-surface-variant">
<div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">Tamamlanma Oranı</p>
<p class="font-h2 text-h2 text-on-surface">%42</p>
</div>
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
</div>
</div>
</section>
<!-- Filters & Content -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(15,23,42,0.05)] border border-surface-variant overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-surface-variant overflow-x-auto">
<button class="flex-1 py-sm px-md font-button text-button text-primary border-b-2 border-primary whitespace-nowrap bg-surface-container-low/50">Bugün</button>
<button class="flex-1 py-sm px-md font-button text-button text-on-surface-variant border-b-2 border-transparent hover:text-on-surface hover:bg-surface-container-low/30 transition-colors whitespace-nowrap">Dün</button>
<button class="flex-1 py-sm px-md font-button text-button text-on-surface-variant border-b-2 border-transparent hover:text-on-surface hover:bg-surface-container-low/30 transition-colors whitespace-nowrap">Tümü</button>
</div>
<div class="p-lg">
<!-- Add New Habit -->
<div class="flex gap-sm mb-lg">
<input class="flex-1 rounded-lg border-outline-variant bg-surface-container-lowest py-xs px-sm font-body-base text-body-base focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-outline" placeholder="Yeni alışkanlık ekle..." type="text"/>
<button class="bg-primary text-on-primary font-button text-button py-xs px-lg rounded-lg hover:bg-primary/90 active:scale-95 transition-all shadow-sm">Ekle</button>
</div>
<!-- Habits List -->
<div class="space-y-sm">
<!-- Habit Item 1 (Completed) -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface-container-lowest border border-surface-variant shadow-[0_1px_3px_rgba(15,23,42,0.02)] border-l-4 border-l-[#2E7D32]">
<div class="flex items-center gap-md">
<input checked="" class="w-5 h-5 rounded text-primary border-outline-variant focus:ring-primary/20 cursor-pointer" type="checkbox"/>
<span class="font-body-base text-body-base text-on-surface line-through opacity-70">Sabah Yürüyüşü (30 dk)</span>
</div>
<button class="text-outline hover:text-error transition-colors p-1 rounded-md hover:bg-error-container/50">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Habit Item 2 -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface-container-lowest border border-surface-variant shadow-[0_1px_3px_rgba(15,23,42,0.02)] hover:shadow-[0_4px_6px_rgba(15,23,42,0.05)] transition-shadow">
<div class="flex items-center gap-md">
<input class="w-5 h-5 rounded text-primary border-outline-variant focus:ring-primary/20 cursor-pointer" type="checkbox"/>
<span class="font-body-base text-body-base text-on-surface">2 Litre Su İç</span>
</div>
<button class="text-outline hover:text-error transition-colors p-1 rounded-md hover:bg-error-container/50">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Habit Item 3 -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface-container-lowest border border-surface-variant shadow-[0_1px_3px_rgba(15,23,42,0.02)] hover:shadow-[0_4px_6px_rgba(15,23,42,0.05)] transition-shadow">
<div class="flex items-center gap-md">
<input class="w-5 h-5 rounded text-primary border-outline-variant focus:ring-primary/20 cursor-pointer" type="checkbox"/>
<span class="font-body-base text-body-base text-on-surface">Kitap Oku (20 sayfa)</span>
</div>
<button class="text-outline hover:text-error transition-colors p-1 rounded-md hover:bg-error-container/50">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Habit Item 4 -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface-container-lowest border border-surface-variant shadow-[0_1px_3px_rgba(15,23,42,0.02)] hover:shadow-[0_4px_6px_rgba(15,23,42,0.05)] transition-shadow">
<div class="flex items-center gap-md">
<input class="w-5 h-5 rounded text-primary border-outline-variant focus:ring-primary/20 cursor-pointer" type="checkbox"/>
<span class="font-body-base text-body-base text-on-surface">İngilizce Çalış (15 dk)</span>
</div>
<button class="text-outline hover:text-error transition-colors p-1 rounded-md hover:bg-error-container/50">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-white dark:bg-slate-900 fixed bottom-0 w-full z-50 pb-safe border-t border-slate-100 dark:border-slate-800 shadow-[0_-1px_3px_rgba(15,23,42,0.05)] md:hidden">
<div class="flex justify-around items-center h-16 w-full max-w-screen-xl mx-auto">
<button class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 gap-1 active:scale-90 transition-transform duration-150 w-full h-full">
<span class="material-symbols-outlined" data-icon="dashboard" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="text-[11px] font-medium font-inter">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 gap-1 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform duration-150 w-full h-full">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="text-[11px] font-medium font-inter">İstatistik</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 gap-1 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform duration-150 w-full h-full">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[11px] font-medium font-inter">Profil</span>
</button>
</div>
</nav>
</body></html>
